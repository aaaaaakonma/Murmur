name: bored_p2p_chat
description: "Private peer-to-peer encrypted chat with custom Diffie-Hellman key exchange and WebRTC."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^0.12.5
  cloud_firestore: ^5.6.5
  firebase_core: ^3.12.1
  crypto: ^3.0.6
  encrypt: ^5.0.3
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  flutter_spinkit: ^5.2.1
  cryptography: ^2.9.0
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^23.0.0
  web: ^1.1.0
  file_picker: ^13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
